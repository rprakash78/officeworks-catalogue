services:
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      FAKE_STORE_API_URL: https://fakestoreapi.com
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SALES_INBOX: sales@example.com
      FROM_EMAIL: catalogue@example.com
    depends_on:
      - mailpit

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
